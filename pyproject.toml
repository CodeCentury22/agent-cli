[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-cli"
version = "0.7.4"
description = "Unified local AI agent CLI."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "rich>=13.0.0",
    "agent-guardrails",
    "agent-vector-memory",
    "agent-workspace-tools",
    "agent-llm-client",
    "agent-core-utils",
    "prompt-toolkit>=3.0.53",
]

[project.scripts]
agent-cli = "agent_cli.main:main"

[tool.uv.sources]
agent-core-utils      = { git = "https://github.com/CodeCentury22/agent-core-utils.git", tag = "v0.2.2" }
agent-guardrails      = { git = "https://github.com/CodeCentury22/agent-guardrails.git", tag = "v0.4.4" }
agent-workspace-tools = { git = "https://github.com/CodeCentury22/agent-workspace-tools.git", tag = "v0.2.2" }
agent-llm-client      = { git = "https://github.com/CodeCentury22/agent-llm-client.git", tag = "v0.5.16" }
agent-vector-memory   = { git = "https://github.com/CodeCentury22/agent-vector-memory.git", tag = "v0.6.2" }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]